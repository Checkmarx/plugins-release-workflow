# Centralized GitHub Workflow for Jira Ticket Creation (.github/workflows/jira_notify.yml)
name: Notify Jira

on:
  workflow_call:
    inputs:
      title:
        description: 'Issue title'
        required: true
        type: string
      body:
        description: 'Body'
        required: true
        type: string
      html_url:
        description: 'URL'
        required: true
        type: string
      repo:
        description: 'Repository name'
        required: true
        type: string
    secrets:
      AST_JIRA_API_TOKEN:
        required: true
      AST_JIRA_USER_EMAIL:
        required: true
      JIRA_FIELDS_BUG:
        required: true
      JIRA_FIELDS_OTHER:
        required: true

permissions: {}

jobs:
  notify_jira:
    name: Notify Jira
    runs-on: cx-public-ubuntu-x64
    permissions:
      issues: write # for creating comments on GitHub issues
      pull-requests: write # for workflow-triggered by pull requests
    env:
      JIRA_URL: "https://checkmarx.atlassian.net/"
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_BODY: ${{ inputs.body }}
      INPUT_HTML_URL: ${{ inputs.html_url }}
      INPUT_REPO: ${{ inputs.repo }}
    steps:
      - name: Jira Login
        uses: atlassian/gajira-login@ca13f8850ea309cf44a6e4e0c49d9aa48ac3ca4c #v3
        env:
          JIRA_BASE_URL: ${{ env.JIRA_URL }}
          JIRA_USER_EMAIL: ${{ secrets.AST_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.AST_JIRA_API_TOKEN }}

      - name: Determine Issue Type
        id: issue_type
        run: |
          if [[ "${INPUT_TITLE}" == *"[Bug]"* ]]; then
            echo "IS_BUG=true" >> $GITHUB_ENV
            echo "Selected Issue Type: BUG"
          else
            echo "IS_BUG=false" >> $GITHUB_ENV
            echo "Selected Issue Type: ENHANCEMENT"
          fi

      - name: Parse Issue Form
        id: parse_issue
        uses: issue-ops/parser@17134bd7d0633c8267868e79fca7023745aee2f9 # v4.1.0
        with:
          body: ${{ github.event.issue.body }}

      - name: Extract Issue Fields
        id: extract_fields
        run: |
          # Extracting fields from the issue body
          ISSUE_DESCRIPTION=$(echo "${INPUT_BODY}" | awk -v RS='' '/### What happened\?/{getline; print}')
          ISSUE_VERSION=$(echo "${INPUT_BODY}" | awk -v RS='' '/### Version/{getline; print}')
          ISSUE_OS=$(echo "${INPUT_BODY}" | awk -v RS='' '/### Operating System & Version/{getline; print}')
          ISSUE_LOGS=$(echo "${INPUT_BODY}" | awk -v RS='' '/### Relevant log output/{getline; print}')
      
          # Printing extracted values to the workflow log
          echo "Extracted Fields:"
          echo "What Happened: $ISSUE_DESCRIPTION"
          echo "Version: $ISSUE_VERSION"
          echo "Operating System & Version: $ISSUE_OS"
          echo "Relevant Logs: $ISSUE_LOGS"
      
          # Setting environment variables for use in subsequent steps
          echo "ISSUE_DESCRIPTION=$ISSUE_DESCRIPTION" >> $GITHUB_ENV
          echo "ISSUE_VERSION=$ISSUE_VERSION" >> $GITHUB_ENV
          echo "ISSUE_OS=$ISSUE_OS" >> $GITHUB_ENV
          echo "ISSUE_LOGS=$ISSUE_LOGS" >> $GITHUB_ENV
        

      - name: Format Jira Description
        id: format_description
        run: |
          FORMATTED_DESCRIPTION="*Issue Title:* ${INPUT_TITLE} \\\\"
          FORMATTED_DESCRIPTION+="*Repository:* ${INPUT_REPO} \\\\"
          FORMATTED_DESCRIPTION+="*What Happened:* $ISSUE_DESCRIPTION \\\\"
          FORMATTED_DESCRIPTION+="*Version:* $ISSUE_VERSION \\\\"
          FORMATTED_DESCRIPTION+="*Operating System & Version:* $ISSUE_OS \\\\"
          if [[ -n "$ISSUE_LOGS" ]]; then
            FORMATTED_DESCRIPTION+=" *Relevant Logs:*\n{code}$ISSUE_LOGS{code} \\\\"
          fi
          FORMATTED_DESCRIPTION+="[View original issue|${INPUT_HTML_URL}]"
          
          echo "FORMATTED_DESCRIPTION=$FORMATTED_DESCRIPTION" >> $GITHUB_ENV

      - name: Create Jira Issue for Bug
        if: env.IS_BUG == 'true'
        id: create_jira_bug
        uses: atlassian/gajira-create@1ff0b6bd115a780592b47bfbb63fc4629132e6ec #v3
        with:
          project: AST
          issuetype: Task
          summary: '${{ env.INPUT_REPO }} ${{ env.INPUT_TITLE }}'
          description: '${{ env.FORMATTED_DESCRIPTION }}'
          fields: "${{ secrets.JIRA_FIELDS_BUG }}"

      - name: Create Jira Issue for Enhancement
        if: env.IS_BUG == 'false'
        id: create_jira_enhancement
        uses: atlassian/gajira-create@1ff0b6bd115a780592b47bfbb63fc4629132e6ec #v3
        with:
          project: AST
          issuetype: Task
          summary: '${{ env.INPUT_REPO }} ${{ env.INPUT_TITLE }}'
          description: '${{ env.FORMATTED_DESCRIPTION }}'
          fields: "${{ secrets.JIRA_FIELDS_OTHER }}"

      - name: Add comment to GitHub issue
        uses: actions/github-script@a3e7071a34d7e1f219a8a4de9a5e0a34d1ee1293 # v4.0.2
        env:
          BUG_ISSUE: ${{ steps.create_jira_bug.outputs.issue }}
          ENHANCEMENT_ISSUE: ${{ steps.create_jira_enhancement.outputs.issue }}
          JIRA_URL: ${{ env.JIRA_URL }}
        with:
          script: |
            const issue_id = process.env.IS_BUG == 'true' ? process.env.BUG_ISSUE : process.env.ENHANCEMENT_ISSUE;
            const jiraUrl = process.env.JIRA_URL;
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Internal Jira issue: [' + issue_id + '](' + jiraUrl + '/browse/' + issue_id + ')'
            })
